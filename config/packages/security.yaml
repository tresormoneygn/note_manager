security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
            logout:
                path: app_logout
                target: app_login
            custom_authenticator: App\Security\UserAuthenticator
            entry_point: form_login
            access_denied_handler: App\Security\AccessDeniedHandler
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                # by default, the feature is enabled by checking a checkbox in the
                # login form, uncomment the following line to always enable it.
                #always_remember_me: true
                # where to redirect after logout
                # target: app_any_route

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    
    role_hierarchy:
        # Tous les rôles héritent de ROLE_USER
        ROLE_P: ROLE_USER
        ROLE_ETUDIANT: ROLE_USER
        ROLE_SCOLARITE: ROLE_USER
        ROLE_CD: ROLE_USER
        ROLE_DP: [ROLE_USER, ROLE_P] # Directeur de Programme hérite des droits des Professeurs
        ROLE_DGA_E: [ROLE_USER, ROLE_DP] # DGA/E hérite des droits des Directeurs de Programme
        ROLE_DGA_R: [ROLE_USER, ROLE_DP] # DGA/R hérite des droits des Directeurs de Programme
        ROLE_SF: ROLE_USER
        ROLE_DG: [ROLE_USER, ROLE_DGA_E, ROLE_DGA_R] # DG hérite de tous les droits
    
    access_control:
        # Routes d'inscription (réservées au DG)
        - { path: ^/register, roles: ROLE_DG }
        
        # Routes de gestion des programmes et départements (réservées au DG et DGA/E)
        - { path: ^/programme/new, roles: ROLE_DG }
        - { path: ^/programme/.*/edit, roles: ROLE_DG }
        - { path: ^/departement/new, roles: ROLE_DGA_E }
        - { path: ^/departement/.*/edit, roles: ROLE_DGA_E }
        
        # Routes de gestion des matières et unités d'enseignement
        - { path: ^/matiere/new, roles: ROLE_DP }                       # Directeurs de Programme
        - { path: ^/matiere/.*/edit, roles: ROLE_DP }                  # Directeurs de Programme
        - { path: ^/unite/enseignement/new, roles: ROLE_DP }           # Directeurs de Programme
        - { path: ^/unite/enseignement/.*/edit, roles: ROLE_DP }       # Directeurs de Programme
        
        # Routes de gestion de l'emploi du temps
        - { path: ^/emploi-du-temps/new, roles: ROLE_DP }              # Directeurs de Programme
        - { path: ^/emploi-du-temps/.*/edit, roles: ROLE_DP }          # Directeurs de Programme
        - { path: ^/emploi-du-temps/etudiant, roles: ROLE_ETUDIANT }   # Étudiants
        
        # Routes de gestion des notes
        - { path: ^/note/new, roles: ROLE_P }                          # Professeurs
        - { path: ^/note/.*/edit, roles: ROLE_P }                      # Professeurs
        - { path: ^/note/valider, roles: ROLE_CD }                     # Chefs de Département
        - { path: ^/note/etudiant, roles: ROLE_ETUDIANT }              # Étudiants
        - { path: ^/note, roles: ROLE_P }                              # Accès général aux notes pour les Professeurs
        
        # Routes publiques
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
